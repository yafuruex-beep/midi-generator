[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "editable_backend"
backend-path = ["build_support"]

[project]
name = "midi-generator"
version = "0.1.0"
description = "Reusable MIDI pattern generation framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mido>=1.3.2,<2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "jsonschema>=4.23,<5.0"]
audio = ["librosa>=0.11,<0.12", "numpy>=1.26,<3.0", "soundfile>=0.13,<0.14"]

[project.scripts]
midi-generator = "midi_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["midi_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
